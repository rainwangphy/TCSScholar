<title>Daily arXiv digest — TCS Paper Archive</title>
<!-- The daily digest is now a tab on the main page rather than a page of its own.
     Links that were handed out while it lived here — including deep links to a
     specific day, which the main page understands as a #YYYY-MM-DD hash — keep
     working through this redirect. -->
<link rel="canonical" href="index.html">
<script>
  var h = location.hash.replace(/^#/, "");
  location.replace("index.html#" + (/^\d{4}-\d{2}-\d{2}$/.test(h) ? h : "daily"));
</script>
<meta http-equiv="refresh" content="0; url=index.html#daily">
<style>
  body { margin: 0; padding: 3rem 1.5rem; background: #f0eee6; color: #191917;
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #a34a26; }
  @media (prefers-color-scheme: dark) { body { background: #1c1b18; color: #f2efe6; } a { color: #e08a63; } }
</style>
</head>
<body>
<p>The daily digest moved into the main page. <a href="index.html#daily">Continue →</a></p>
</body>
