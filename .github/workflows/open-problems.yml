name: Open problems watch

on:
  schedule:
    # 每周一 07:00 UTC。比每日那条晚一小时，免得两条流水线同时往仓库推。
    # 公开问题不是每天都有人宣称解决，一周扫一次足够，也省模型额度。
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      search:
        description: "额外去 arXiv 查一轮（不止扫已有的每日归档）"
        type: boolean
        default: true
      rejudge:
        description: "忽略已有判定，全部重判（费额度）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: open-problems
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 和别的脚本一样只用标准库，没有 pip install 这一步

      - name: Scan for candidate resolutions
        env:
          # 没配这个 secret 时脚本会降级成只跑规则层，不会失败
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IN_SEARCH: ${{ inputs.search }}
          IN_REJUDGE: ${{ inputs.rejudge }}
        run: |
          args=()
          # 定时触发时 inputs 是空的，这时默认查 arXiv
          [ "${IN_SEARCH:-true}" = "true" ] && args+=(--search)
          [ "$IN_REJUDGE" = "true" ] && args+=(--rejudge)
          python open_problems.py "${args[@]}"

      # 登记表里的"证据"要站得住，链接就不能是死的。核对失败不该挡住这次更新，
      # 所以只写进 job summary 让人看见。
      - name: Check reference links
        continue-on-error: true
        run: |
          echo '## Reference links' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python open_problems.py --check-refs --delay 2 2>&1 | tail -n 40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 有预印本宣称解决了清单上的某个问题时，把它顶到 job summary 里。
      # 脚本不会自己改状态，得有人去读那篇论文。
      - name: Surface the review queue
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("site/open/index.json").read_text(encoding="utf-8"))
          print(f"## Open problems\n\n{d['counts']['open']} open · "
                f"{d['signal_count']} signals · {d['counts']['resolved']} resolved\n")
          if not d["flagged"]:
              print("No preprint claimed a listed problem this week.")
          else:
              print("### ⚠️ Claimed resolutions — needs a human\n")
              for pid in d["flagged"]:
                  p = next(x for x in d["problems"] if x["id"] == pid)
                  print(f"**{p['title']}**\n")
                  for s in p["signals"]:
                      if (s.get("verdict") or {}).get("verdict") == "resolves":
                          print(f"- [{s['title']}]({s['url']}) — {s['verdict']['claim']}")
                  print()
              print("Read the paper before touching `problems/registry.json`.")
          PY

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/open
          if git diff --cached --quiet; then
            echo "清单没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "未解问题清单：$(python -c "import json;d=json.load(open('site/open/index.json'));print(d['counts']['open'],'open,',d['signal_count'],'signals')")"
            # 和每日那条流水线撞车时重来一次，不必因此整个失败
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 和每日那条一样：Actions 用 GITHUB_TOKEN 推的 commit 不会触发 on: push，
  # 所以要显式把部署流水线调起来
  deploy:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
