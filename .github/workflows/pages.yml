name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # 每日 arXiv 那条流水线提交完新数据后直接调这里部署——Actions 自己推的 commit
  # 不会触发上面的 push，所以必须显式调用
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；新的 push 排队而不是取消正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # enablement: 仓库没开 Pages 时由 action 自己调 API 开（并设为 Actions 构建），
      # 免得必须先去 Settings → Pages 手动点一次
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # template.html 里还留着 __SITE_DATA__ 占位符，不该发出去
      - name: Stage site
        run: |
          # index.html 是本地 build_site.py 的产物；万一忘了跑就提交了模板，
          # 与其发一个空页面出去，不如让部署直接失败
          if grep -q '__SITE_DATA__' site/index.html; then
            echo "::error::site/index.html 还是模板，先跑 python analyze.py && python build_site.py"
            exit 1
          fi
          mkdir -p _site
          cp site/index.html _site/index.html
          # 摘要分片，页面点开某篇时按需去取
          if [ -d site/abstracts ]; then
            cp -R site/abstracts _site/abstracts
            echo "staged $(ls site/abstracts | wc -l) abstract shards"
          else
            echo "::warning::site/abstracts 不存在，页面上的摘要会加载失败"
          fi
          # 每日 arXiv 速读。这一页是纯静态的，数据在运行时从 daily/*.json 取，
          # 所以不像 index.html 那样需要先在本地构建
          if [ -f site/daily.html ]; then
            cp site/daily.html _site/daily.html
          fi
          if [ -d site/daily ]; then
            cp -R site/daily _site/daily
            echo "staged $(ls site/daily/20*.json 2>/dev/null | wc -l) daily digests"
          else
            echo "::warning::site/daily 不存在，每日速读页会是空的（先跑 python daily.py）"
          fi
          # 未解问题清单。和每日一样在运行时 fetch，所以也不需要本地构建
          if [ -d site/open ]; then
            cp -R site/open _site/open
            echo "staged the open-problem list"
          else
            echo "::warning::site/open 不存在，未解问题 tab 会是空的（先跑 python open_problems.py）"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
